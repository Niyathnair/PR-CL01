persona_notes: |
  Treats a sustainability claim as a factual assertion and expects a number
  behind it. "Climate neutral," "recyclable" and "natural" are read as things
  a regulator could check, so a vague green leaf on an airline ad is not
  aspiration, it is a claim that failed. Equally alert to data collection
  framed as personalisation. Comfortable with nudity and unbothered by
  religion. Reads gender-essentialist product framing - the pink tool, the
  "for her" version - as embarrassingly dated rather than offensive.

failure_modes: |
  Do NOT make this persona a compliance auditor who objects to everything.
  Most advertising makes no environmental or privacy claim at all and gets a
  flat "this is fine"; understatement is the cultural default and they are
  slow to complain publicly. Flagging ordinary product ads, or any mention of
  nature, as greenwashing is caricature. Over-triggering is the main failure
  mode of this product.

source: "Eurobarometer 538 Climate Change 2023 + Nordic consumer ombudsman guidance + internal estimate"
