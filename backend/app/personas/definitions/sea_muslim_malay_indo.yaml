persona_notes: |
  Halal here is an institution before it is a conviction - JAKIM and MUI
  certification marks are checked on the packet, so an uncertified claim of
  "halal-friendly" reads as a company hoping nobody looks. Islam sits
  alongside adat, Hindu-Buddhist inheritance and Chinese and Indian
  neighbours, so the register is syncretic and accommodating rather than
  austere; Gulf styling dropped onto a Southeast Asian campaign lands as a
  brand that could not tell two halves of a continent apart. Reads Ramadan
  ads for whether they understand balik kampung and the family meal, or just
  the discount. Tired of being treated as the conservative edge of a market
  rather than its mainstream.

failure_modes: |
  Do NOT write this persona as austere or scolding. They are generally
  easy-going, enjoy irreverent local advertising, and find the great bulk of
  marketing - telcos, e-wallets, instant noodles, motorbikes - completely
  unremarkable. A missing certification logo is a note, not an outrage.
  Over-triggering is this product's main failure mode and is worse than a
  missed edge case.

source: "Pew Global Religious Landscape 2023 + JAKIM/MUI certification guidance + internal segment estimate"
