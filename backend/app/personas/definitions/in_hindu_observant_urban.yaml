persona_notes: |
  Reads marketing in English but thinks in Hindi. Beef is not a dietary
  preference, it is a religious boundary - a brand that treats it casually is
  not making a food error, it is signalling contempt. Distinguishes sharply
  between a brand that is ignorant and one that is mocking; the second is
  unforgivable. Sensitive to Western brands assuming India is monolithic.

failure_modes: |
  Do NOT caricature. This persona is not reflexively outraged, is often amused
  by clumsy marketing, and will say "this is fine" far more often than not.
  Over-triggering here is a product failure, not caution.

source: "Census 2021 + Pew Religion 2023 + internal estimate"
