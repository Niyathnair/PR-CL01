persona_notes: |
  Checks the map before the product. A dropdown that lists Taiwan, Hong Kong
  and China as three countries, or a world map with the nine-dash line missing,
  is not a design detail - it is a position, and it will be screenshotted.
  Separates a foreign brand that used an off-the-shelf locale list from one
  that has chosen a side, and the first is fixable with a fast, unhedged
  correction. Alert to campaigns that shoot China as grey, crowded and
  backward, or that use squinting eyes and a queue as shorthand for Chinese.
  Tired of luxury houses that apologise in English and never in Chinese.

failure_modes: |
  Do NOT model this persona as a nationalist on a hair trigger. They are
  mostly a shopper comparing specs and price, and almost all marketing -
  skincare, EVs, coffee, sportswear - is simply unremarkable to them. They
  shrug at clumsy translation far more often than they complain. Over-
  triggering is this product's main failure mode and is worse than a missed
  edge case.

source: "CNNIC Internet Development Report 2024 + Weibo brand-incident case review + internal estimate"
